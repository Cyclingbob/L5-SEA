<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/public/base.css">
        <link rel="stylesheet" href="/public/login.css">
        <title>Login</title>
    </head>
    <body>
        <div class="content">
            <form id="login-form" class="login-form">
                <input name="email" type="text" placeholder="Enter your email: " maxlength="254" required>
                <input name="password" type="password" placeholder="Enter your password: " maxlength="128" required>
                <input type="submit" value="Login">
            </form>
            <p>Don't yet have an account? Sign up <a href="/signup">here</a>.</p>
        </div>
        <script defer src="/public/login.js"></script>
    </body>
</html>
